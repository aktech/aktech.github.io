{{ define "main" }}
<div class="posts">
  {{ range .Pages }}
  <div class="post">
    <h1 class="post-title">
      <a href="{{ .Permalink }}">
        {{ .Title }}
      </a>
    </h1>

    <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>

    {{ .Summary }}
  </div>
  {{ end }}
</div>
{{ end }}
