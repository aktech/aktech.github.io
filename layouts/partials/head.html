<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="keywords" content="aktech, amit kumar, dtu, maths, python, github">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Amit Kumar's Personal Blog">

  <!--
    manifest.json provides metadata used when your web app is added to the
    homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
  -->

  {{ partial "opengraph.html" . }}


  <title>
    {{ if eq .Title "Home" }}
      {{ .Site.Title }} &middot; {{ .Site.Params.tagline }}
    {{ else }}
      {{ .Title }} &middot; {{ .Site.Title }}
    {{ end }}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ .Site.BaseURL }}/public/css/poole.css">
  <link rel="stylesheet" href="{{ .Site.BaseURL }}/public/css/syntax.css">
  <link rel="stylesheet" href="{{ .Site.BaseURL }}/public/css/lanyon.css">
  <link rel="stylesheet" href="{{ .Site.BaseURL }}/public/theme/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Fira+Code:wght@300;400;500;600;700&display=swap">

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ .Site.BaseURL }}public/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="{{ .Site.BaseURL }}public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/index.xml">

  <!-- mixpanel -->
  {{ partial "mixpanel.html" . }}

  <!-- Dark mode theme switcher -->
  <script>
    // Load theme before page renders to prevent flash
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  </head>
