  if (d.getElementById(id)) return;
  js = d.createElement(s); js.id = id;
  js.src = "//connect.facebook.net/en_US/sdk.js#xfbml=1&version=v2.0";
  fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'facebook-jssdk'));</script>

<!-- Theme toggle functionality -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const themeToggle = document.getElementById('theme-toggle');
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const html = document.documentElement;

    // Get current theme
    let currentTheme = localStorage.getItem('theme') || 'light';

    // Update icon visibility based on current theme
    function updateToggleButton(theme) {
      if (theme === 'dark') {
        // In dark mode, show sun icon (click to go to light)
        lightIcon.style.display = 'inline-block';
        darkIcon.style.display = 'none';
      } else {
        // In light mode, show moon icon (click to go to dark)
        lightIcon.style.display = 'none';
        darkIcon.style.display = 'inline-block';
      }
    }

    // Set initial button state
    updateToggleButton(currentTheme);

    // Toggle theme on button click
    themeToggle.addEventListener('click', function() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';

      if (currentTheme === 'dark') {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }

      localStorage.setItem('theme', currentTheme);
      updateToggleButton(currentTheme);
    });
  });
</script>

<!-- Code copy button functionality -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Find all code blocks with .highlight class
    const codeBlocks = document.querySelectorAll('.highlight');

    codeBlocks.forEach(function(codeBlock) {
      // Create copy button
      const copyButton = document.createElement('button');
      copyButton.className = 'code-copy-button';
      copyButton.setAttribute('aria-label', 'Copy code to clipboard');

      // Create both icons wrapped in spans for proper show/hide
      copyButton.innerHTML = `<span class="clipboard-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></span><span class="check-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;

      // Add click handler
      copyButton.addEventListener('click', function(e) {
        // Prevent default and blur to remove focus outline
        e.preventDefault();
        copyButton.blur();

        // Get the code content
        const pre = codeBlock.querySelector('pre');
        const code = pre.querySelector('code') || pre;
        const textToCopy = code.textContent;

        // Copy to clipboard
        navigator.clipboard.writeText(textToCopy).then(function() {
          // Add copied class (CSS handles icon visibility)
          copyButton.classList.add('copied');

          // Reset after 2 seconds
          setTimeout(function() {
            copyButton.classList.remove('copied');
          }, 2000);
        }).catch(function(err) {
          console.error('Failed to copy code:', err);
        });
      });

      // Add button to code block
      codeBlock.appendChild(copyButton);
    });
  });
</script>
