{{ with .Params.travelYear }}
  {{ $dataKey := printf "travel_%s" . }}
  {{ with index $.Site.Data $dataKey }}

<!-- Leaflet, borders and fonts are vendored in static/maps (scripts/vendor_travel_map.py), so the map makes no requests to other servers -->
<link rel="stylesheet" href="{{ "maps/leaflet/leaflet.css" | relURL }}" />

<div class="travel-map" data-travel-map data-countries="{{ "maps/countries.geojson" | relURL }}" data-locations="{{ . | jsonify }}"></div>
<p class="travel-map-caption">Places I traveled in {{ $.Params.travelYear }}</p>

<script src="{{ "maps/leaflet/leaflet.js" | relURL }}"></script>
<script type="module" src="{{ "maps/travel-map.mjs" | relURL }}"></script>

  {{ end }}
{{ end }}
