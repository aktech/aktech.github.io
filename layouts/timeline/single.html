{{ define "main" }}
{{/* Newest year first, newest post first within each year */}}
{{ range (where .Site.RegularPages "Section" "blog").ByDate.Reverse.GroupByDate "2006" }}
  <h2>{{ .Key }}</h2>
  <ul>
  {{ range .Pages }}
    <li><a href="{{ .Permalink }}">{{ .Title | safeHTML }}</a></li>
  {{ end }}
  </ul>
{{ end }}
{{ end }}
