name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  generate-tts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache TTS audio files
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: static/audio
          key: tts-audio-shard-${{ matrix.shard }}-${{ hashFiles('content/blog/**/*.md', 'scripts/generate_tts.mjs') }}
          restore-keys: |
            tts-audio-shard-${{ matrix.shard }}-

      - name: Generate TTS audio
        run: |
          npm install kokoro-js@1.2.1
          node scripts/generate_tts.mjs --shard ${{ matrix.shard }} --total-shards 6

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-shard-${{ matrix.shard }}
          path: static/audio/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: generate-tts
    env:
      HUGO_VERSION: 0.152.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all TTS audio shards
        uses: actions/download-artifact@v4
        with:
          path: static/audio
          pattern: tts-audio-shard-*
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          python-version: "3.14"

      - name: Generate OG base image
        run: uv run scripts/generate_og_base.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          mkdir -p data
          GIT_COMMIT_HASH=$(git rev-parse --short HEAD)
          GIT_COMMIT_HASH_FULL=$(git rev-parse HEAD)
          cat > data/git.json <<EOF
          {
            "hash": "$GIT_COMMIT_HASH",
            "hashFull": "$GIT_COMMIT_HASH_FULL"
          }
          EOF
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Create atom.xml symlink
        run: cp public/index.xml public/atom.xml

      - name: Build Pagefind search index
        run: npx -y pagefind --site public

      - name: Install htmltest
        run: |
          wget -O ${{ runner.temp }}/htmltest.tar.gz https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz \
          && tar xzf ${{ runner.temp }}/htmltest.tar.gz -C ${{ runner.temp }} \
          && sudo mv ${{ runner.temp }}/htmltest /usr/local/bin/

      - name: Test HTML
        run: htmltest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
