name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan-tts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_posts: ${{ steps.plan.outputs.has_posts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download existing audio from live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p static/audio
          SITE_URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url' 2>/dev/null || echo "")
          if [ -z "$SITE_URL" ]; then
            echo "Could not determine Pages URL, skipping"
            exit 0
          fi
          SITE_URL="${SITE_URL%/}"
          echo "Live site: $SITE_URL"
          for slug in $(node scripts/generate_tts.mjs --list-slugs); do
            if curl -sf --max-time 10 "$SITE_URL/audio/$slug.wav" -o "static/audio/$slug.wav" 2>/dev/null && \
               curl -sf --max-time 5 "$SITE_URL/audio/$slug.sha256" -o "static/audio/$slug.sha256" 2>/dev/null; then
              echo "  fetched $slug"
            else
              rm -f "static/audio/$slug.wav" "static/audio/$slug.sha256"
            fi
          done
          echo "Downloaded $(ls static/audio/*.wav 2>/dev/null | wc -l) audio files"

      - name: Plan TTS generation
        id: plan
        run: |
          MATRIX=$(node scripts/generate_tts.mjs --plan)
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload cached audio
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-cached
          path: static/audio/
          if-no-files-found: ignore

  generate-tts:
    runs-on: ubuntu-latest
    needs: plan-tts
    if: needs.plan-tts.outputs.has_posts == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-tts.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate TTS audio
        run: |
          npm install kokoro-js@1.2.1
          node scripts/generate_tts.mjs --slug "${{ matrix.slug }}"

      - name: Upload audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio-${{ matrix.slug }}
          path: static/audio/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: [plan-tts, generate-tts]
    if: always() && needs.plan-tts.result == 'success'
    env:
      HUGO_VERSION: 0.152.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download cached audio
        uses: actions/download-artifact@v4
        with:
          name: tts-audio-cached
          path: static/audio
        continue-on-error: true

      - name: Download generated audio
        if: needs.generate-tts.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: static/audio
          pattern: tts-audio-*
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          python-version: "3.14"

      - name: Generate OG base image
        run: uv run scripts/generate_og_base.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          mkdir -p data
          GIT_COMMIT_HASH=$(git rev-parse --short HEAD)
          GIT_COMMIT_HASH_FULL=$(git rev-parse HEAD)
          cat > data/git.json <<EOF
          {
            "hash": "$GIT_COMMIT_HASH",
            "hashFull": "$GIT_COMMIT_HASH_FULL"
          }
          EOF
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Create atom.xml symlink
        run: cp public/index.xml public/atom.xml

      - name: Build Pagefind search index
        run: npx -y pagefind --site public

      - name: Install htmltest
        run: |
          wget -O ${{ runner.temp }}/htmltest.tar.gz https://github.com/wjdp/htmltest/releases/download/v0.17.0/htmltest_0.17.0_linux_amd64.tar.gz \
          && tar xzf ${{ runner.temp }}/htmltest.tar.gz -C ${{ runner.temp }} \
          && sudo mv ${{ runner.temp }}/htmltest /usr/local/bin/

      - name: Test HTML
        run: htmltest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
