baseURL = "https://aktech.github.io/"
languageCode = "en-us"
title = "Amit Kumar"

[frontmatter]
  date = ["date", ":filename", ":fileModTime"]

[params]
  tagline = ": Life Is Learning!"
  description = "Programmer · Developer · Learner"
  short_url = "iamit.in/"
  production_url = "https://aktech.github.io/"
  source_url = "https://github.com/aktech.github.io"

  [params.author]
    name = "Amit Kumar"
    email = "dtu.amit@gmail.com"

  [params.github]
    main = "https://github.com/aktech/aktech.github.io"

  [params.contact]
    github = "https://github.com/aktech"
    twitter = "https://twitter.com/iaktech"
    gmail = "mailto:dtu.amit@gmail.com"
    quora = "https://www.quora.com/Amit-Kumar-516"

[permalinks]
  blog = "/blog/:title/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[taxonomy]
  [taxonomy.tags]
    path = "/blog/tags/"

# Preserve tag case - don't lowercase
disablePathToLower = true
preserveTaxonomyNames = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
